name: iOS CI (YagyoPlayer)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  IOS_VERSION: "26.0"
  SIMULATOR_DEVICE: "iPhone 16"

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Swift / iOS Simulator)
    runs-on: macos-15

    env:
      PLATFORM: iOS Simulator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          echo "Expected developer dir: ${DEVELOPER_DIR}"

      - name: Preflight SDK and simulator runtime
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -showsdks
          runtimes="$(xcrun simctl list runtimes available)"
          devices="$(xcrun simctl list devices available)"
          echo "${runtimes}"
          echo "${devices}"

          # IOS_VERSION is a preference, not a hard pin: runner images rotate
          # point releases (e.g. 26.0 -> 26.0.1) faster than this file changes,
          # and xcodebuild only matches installed runtimes exactly. Resolve to
          # the newest installed runtime matching IOS_VERSION as a version
          # prefix, falling back to the newest installed iOS runtime.
          resolved="$(sed -nE '/unavailable/d; s/^iOS ([0-9][0-9.]*).*/\1/p' <<< "${runtimes}" | sort -V | awk -v want="${IOS_VERSION}" '
            { latest = $0 }
            index($0 ".", want ".") == 1 { best = $0 }
            END {
              if (best != "") { print best }
              else if (latest != "") { print latest }
            }
          ')"

          if [[ -z "${resolved}" ]]; then
            echo "::error::No iOS simulator runtime is installed."
            exit 1
          fi

          if [[ "${resolved}" != "${IOS_VERSION}" ]]; then
            echo "::warning::iOS ${IOS_VERSION} simulator runtime is not installed; using iOS ${resolved} instead."
          fi

          # Address the device by UDID rather than name+OS: simctl reports the
          # runtime's marketing name (e.g. "iOS 26.0" for the 26.0.1 runtime)
          # while xcodebuild's OS= specifier matches the product version
          # (26.0.1), so version strings cannot be passed through reliably.
          udid="$(awk -v runtime="iOS ${resolved}" -v device="${SIMULATOR_DEVICE}" '
            /^-- / {
              header = $0
              sub(/^-- /, "", header)
              sub(/ --$/, "", header)
              in_runtime = (header == runtime)
              next
            }

            in_runtime {
              line = $0
              sub(/^[[:space:]]+/, "", line)
              if (index(line, device " (") == 1) {
                rest = substr(line, length(device) + 2)
                if (match(rest, /\([0-9A-Fa-f][0-9A-Fa-f-]*\)/)) {
                  print substr(rest, RSTART + 1, RLENGTH - 2)
                  exit 0
                }
              }
            }
          ' <<< "${devices}")"

          if [[ -z "${udid}" ]]; then
            echo "::error::Required simulator device ${SIMULATOR_DEVICE} is not available for iOS ${resolved}."
            exit 1
          fi

          echo "Resolved ${SIMULATOR_DEVICE} (iOS ${resolved}) to UDID ${udid}"
          destination="platform=${PLATFORM},id=${udid}"
          echo "destination=${destination}" >> "$GITHUB_OUTPUT"
          echo "Using destination: ${destination}"

      - name: Detect scheme and container
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # workspace 優先
          workspace="$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit | sed 's|^\./||')"
          project="$(find . -maxdepth 1 -name "*.xcodeproj" -print -quit | sed 's|^\./||')"

          if [[ -n "${workspace}" ]]; then
            container_flag="-workspace"
            container_path="${workspace}"
            list_json="$(xcodebuild -list -json -workspace "${workspace}")"
          elif [[ -n "${project}" ]]; then
            container_flag="-project"
            container_path="${project}"
            list_json="$(xcodebuild -list -json -project "${project}")"
          else
            echo "No .xcworkspace or .xcodeproj found at repository root."
            exit 1
          fi

          scheme="$(ruby -rjson -e '
            data = JSON.parse(STDIN.read)
            schemes = data["workspace"] && data["workspace"]["schemes"]
            schemes = data["project"]["schemes"] if (schemes.nil? || schemes.empty?) && data["project"]
            abort("No scheme found") if schemes.nil? || schemes.empty?
            puts schemes.first
          ' <<< "${list_json}")"

          echo "container_flag=${container_flag}" >> "$GITHUB_OUTPUT"
          echo "container_path=${container_path}" >> "$GITHUB_OUTPUT"
          echo "scheme=${scheme}" >> "$GITHUB_OUTPUT"

          echo "Detected: ${container_flag} ${container_path}"
          echo "Detected scheme: ${scheme}"

      - name: Build for testing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            "${{ steps.detect.outputs.container_flag }}" "${{ steps.detect.outputs.container_path }}" \
            -destination "${{ steps.preflight.outputs.destination }}" \
            | xcpretty

      - name: Test without building
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            "${{ steps.detect.outputs.container_flag }}" "${{ steps.detect.outputs.container_path }}" \
            -destination "${{ steps.preflight.outputs.destination }}" \
            -resultBundlePath TestResults.xcresult \
            | xcpretty

      - name: Upload xcresult (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore
